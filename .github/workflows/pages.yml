name: Collect and publish election data
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect official results
        run: python3 scripts/update.py
      - name: Test data handling
        run: |
          python3 -m unittest discover -s tests -v
          node --test tests/test_chart.cjs
      - name: Store observed snapshots
        run: |
          if ! git diff --quiet -- data/results.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/results.json
            git commit -m 'data: record TSE apuracao snapshot'
            git push
          fi
      - name: Assemble static site
        run: |
          mkdir -p dist/data
          cp index.html style.css app.js dist/
          cp data/results.json dist/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
